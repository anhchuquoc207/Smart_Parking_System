<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Occupancy Signage</title>
    <link rel="stylesheet" href="../shared/spms-ui.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #zones-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            gap: 10vw;
        }

        .zone-card {
            width: 30vw;
            max-width: 450px;
            height: 75vh;
            max-height: 800px;
            border: 8px solid #4ade80;
            border-radius: 10px;
            background: #1e1e1e;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .zone-title {
            font-size: 6rem;
            font-weight: bold;
            color: #ffffff;
            text-align: center;
            line-height: 1.1;
        }

        .zone-status {
            font-size: 3rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .zone-count {
            font-size: 4.5rem;
            font-weight: bold;
        }

        .border-available { border-color: #4ade80; }
        .border-near-full { border-color: #facc15; }
        .border-full      { border-color: #f87171; }

        .text-available { color: #4ade80; }
        .text-near-full { color: #facc15; }
        .text-full      { color: #f87171; }
    </style>
</head>
<body>
    <button type="button" class="spms-floating-back" onclick="window.SPMS_UI?.goBack();">← Back</button>

    <div id="zones-container">
        <div id="zone-a-card" class="zone-card border-available">
            <div class="zone-title">ZONE A</div>
            <div id="zone-a-status" class="zone-status text-available">AVAILABLE</div>
            <div id="zone-a-count" class="zone-count text-available">--/--</div>
        </div>

        <div id="zone-b-card" class="zone-card border-available">
            <div class="zone-title">ZONE B</div>
            <div id="zone-b-status" class="zone-status text-available">AVAILABLE</div>
            <div id="zone-b-count" class="zone-count text-available">--/--</div>
        </div>
    </div>

    <script src="../shared/spms-db.js"></script>
    <script src="../shared/spms-ui.js"></script>
    <script src="app.js"></script>

</body>
</html>
