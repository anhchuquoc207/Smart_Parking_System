<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Occupancy Signage</title>
    <link rel="stylesheet" href="../shared/spms-ui.css">
    <style>
        /* High contrast styling for digital signage */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .container {
            padding: 40px;
            border-radius: 20px;
            background: #1e1e1e;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 80%;
            max-width: 800px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
            color: #aaaaaa;
        }

        #occupancy-count {
            font-size: 12rem;
            font-weight: bold;
            margin: 20px 0;
            line-height: 1;
        }

        #status-message {
            font-size: 3.5rem;
            font-weight: bold;
            text-transform: uppercase;
            padding: 20px;
            border-radius: 15px;
        }

        /* Dynamic Status Colors */
        .status-available { color: #4ade80; } /* Green */
        .status-near-full { color: #facc15; } /* Yellow */
        .status-full { color: #f87171; }      /* Red */
        
        .bg-available { background-color: rgba(74, 222, 128, 0.1); border: 2px solid #4ade80; }
        .bg-near-full { background-color: rgba(250, 204, 21, 0.1); border: 2px solid #facc15; }
        .bg-full { background-color: rgba(248, 113, 113, 0.1); border: 2px solid #f87171; }
    </style>
</head>
<body>
    <button type="button" class="spms-floating-back" onclick="window.SPMS_UI?.goBack();">← Back</button>

    <div class="container">
        <h1>CURRENT OCCUPANCY</h1>
        <div id="occupancy-count" class="status-available">-- / --</div>
        <div id="status-message" class="bg-available status-available">Connecting...</div>
    </div>

    <script src="../shared/spms-db.js"></script>
    <script src="../shared/spms-ui.js"></script>
    <script src="app.js"></script>

</body>
</html>
