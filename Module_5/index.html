<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Parking - IoT Occupancy Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <div>
                 <button type="button" class="back-btn" onclick="history.back();">←</button>
                <h1>IoT Occupancy Dashboard</h1>
                <p class="subtitle">Module 5: Sensor Management System</p>
            </div>
            <div class="stats-card">
                <div class="stat">
                    <span class="stat-title">Total Slots</span>
                    <span class="stat-value" id="total-slots">100</span>
                </div>
                <div class="stat">
                    <span class="stat-title text-green">Available</span>
                    <span class="stat-value text-green" id="available-slots">100</span>
                </div>
                <div class="stat">
                    <span class="stat-title text-red">Occupied</span>
                    <span class="stat-value text-red" id="occupied-slots">0</span>
                </div>
            </div>
        </div>
       
<div class="signage-preview">
    <div class="signage-box">
        <div class="signage-title">ZONE A</div>
        <div class="signage-status">AVAILABLE</div>
        <div class="signage-count" id="sign-a-avail">50/50</div>
    </div>
    <div class="signage-box">
        <div class="signage-title">ZONE B</div>
        <div class="signage-status">AVAILABLE</div>
        <div class="signage-count" id="sign-b-avail">50/50</div>
    </div>
</div>

        <div id="parking-grid" 
           
    </div>

    <script src="app.js"></script>
</body>
</html>
